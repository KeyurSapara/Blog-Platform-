# CD: every push to main runs CI, then deploys the backend (EC2 via SSM) and frontend (S3 + CloudFront).
# One-time setup after `terraform apply`:  cd terraform && terraform output -raw github_actions_setup | bash
# Until those repository variables exist, the deploy job is skipped and only CI runs.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: ci
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS role, no stored access keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package backend and upload to S3
        id: package
        run: |
          key="backend/${GITHUB_SHA}.tgz"
          tar --exclude=node_modules --exclude=.env --exclude=test -czf backend.tgz -C app/backend .
          aws s3 cp backend.tgz "s3://${ARTIFACT_BUCKET}/${key}"
          url="$(aws s3 presign "s3://${ARTIFACT_BUCKET}/${key}" --expires-in 900)"
          echo "::add-mask::${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend on EC2 (SSM Run Command)
        env:
          ARTIFACT_URL: ${{ steps.package.outputs.url }}
        run: |
          params="$(jq -n --arg u "$ARTIFACT_URL" '{commands: ["/usr/local/bin/blog-deploy \"\($u)\""]}')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CloudBlog deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command: $cmd_id"

          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" || true
          result="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID")"
          echo "$result" | jq -r '.StandardOutputContent, .StandardErrorContent'
          status="$(echo "$result" | jq -r .Status)"
          echo "Status: $status"
          test "$status" = "Success"

      - name: Deploy frontend to S3
        # config.js is generated by Terraform and is not overwritten here.
        run: |
          aws s3 sync app/frontend "s3://${FRONTEND_BUCKET}" \
            --exclude config.js --exclude config.example.js --cache-control no-cache

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' > /dev/null
