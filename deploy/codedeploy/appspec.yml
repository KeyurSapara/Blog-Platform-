# AWS CodeDeploy (EC2/on-premises). Copies the backend over the release on the server;
# the .env written by Ansible is not part of the bundle, so it is kept.
version: 0.0
os: linux
files:
  - source: app
    destination: /opt/blog/backend
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
