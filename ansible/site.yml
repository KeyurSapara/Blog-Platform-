---
# Configures the EC2 instance created by Terraform:
#   Node.js API (systemd) behind Nginx, RDS CA bundle, a nightly backup cron job,
#   and the AWS CodeDeploy agent used by the CodePipeline CD pipeline.
# Inventory and group_vars/blog.yml are generated by `terraform apply`.

- name: Configure CloudBlog API server
  hosts: blog
  become: true
  gather_facts: false

  vars:
    app_user: blog
    app_dir: /opt/blog
    app_port: 3000
    node_major: 24
    backend_src: "{{ playbook_dir }}/../app/backend"
    build_dir: "{{ playbook_dir }}/.build"
    rds_ca_url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem

  pre_tasks:
    - name: Wait for the instance to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    # ---------- System packages ----------
    - name: Install system packages
      ansible.builtin.apt:
        name: [nginx, mysql-client, acl, curl, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Node.js {{ node_major }} from NodeSource
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -
        apt-get install -y nodejs
      args:
        executable: /bin/bash
        creates: /usr/bin/node

    # ---------- App user and files ----------
    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: false

    - name: Create app directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/backend"
        - "{{ app_dir }}/logs"

    - name: Download RDS CA bundle (TLS to MySQL)
      ansible.builtin.get_url:
        url: "{{ rds_ca_url }}"
        dest: "{{ app_dir }}/rds-ca.pem"
        owner: "{{ app_user }}"
        mode: "0644"

    - name: Package backend source locally
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.shell: |
        mkdir -p "{{ build_dir }}"
        tar --exclude=node_modules --exclude=.env --exclude=test -czf "{{ build_dir }}/backend.tgz" -C "{{ backend_src }}" .
      changed_when: false

    - name: Upload backend source
      ansible.builtin.unarchive:
        src: "{{ build_dir }}/backend.tgz"
        dest: "{{ app_dir }}/backend"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
      notify: Restart blog-api

    - name: Install npm dependencies
      become_user: "{{ app_user }}"
      ansible.builtin.command: npm install --omit=dev --no-audit --no-fund
      args:
        chdir: "{{ app_dir }}/backend"
      environment:
        HOME: "{{ app_dir }}"
      changed_when: false

    - name: Write app configuration (.env)
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/backend/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      notify: Restart blog-api

    # ---------- Service ----------
    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/blog-api.service.j2
        dest: /etc/systemd/system/blog-api.service
        mode: "0644"
      notify: Restart blog-api

    - name: Enable and start blog-api
      ansible.builtin.systemd_service:
        name: blog-api
        enabled: true
        state: started
        daemon_reload: true

    # ---------- Nginx reverse proxy ----------
    - name: Configure Nginx site
      ansible.builtin.template:
        src: templates/nginx-blog.conf.j2
        dest: /etc/nginx/sites-available/blog
        mode: "0644"
      notify: Reload nginx

    - name: Enable blog site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/blog
        dest: /etc/nginx/sites-enabled/blog
        state: link
      notify: Reload nginx

    - name: Disable default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    # ---------- CI/CD: AWS CodeDeploy agent ----------
    - name: Install CodeDeploy agent prerequisites
      ansible.builtin.apt:
        name: [ruby-full, wget]
        state: present

    - name: Install the CodeDeploy agent (receives deployments from CodePipeline)
      ansible.builtin.shell: |
        set -euo pipefail
        cd /tmp
        wget -q "https://aws-codedeploy-{{ aws_region }}.s3.{{ aws_region }}.amazonaws.com/latest/install" -O codedeploy-install
        chmod +x codedeploy-install
        ./codedeploy-install auto
      args:
        executable: /bin/bash
        creates: /opt/codedeploy-agent/bin/codedeploy-agent

    - name: Ensure the CodeDeploy agent is running
      ansible.builtin.systemd_service:
        name: codedeploy-agent
        enabled: true
        state: started

    # ---------- Backups to Azure ----------
    - name: Nightly database backup to Azure Blob Storage (02:00 UTC)
      ansible.builtin.cron:
        name: cloudblog-db-backup
        user: "{{ app_user }}"
        minute: "0"
        hour: "2"
        job: "cd {{ app_dir }}/backend && /usr/bin/node src/backup.js >> {{ app_dir }}/logs/backup.log 2>&1"

  post_tasks:
    - name: Apply pending handler restarts
      ansible.builtin.meta: flush_handlers

    - name: Check API health through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

  handlers:
    - name: Restart blog-api
      ansible.builtin.systemd_service:
        name: blog-api
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
